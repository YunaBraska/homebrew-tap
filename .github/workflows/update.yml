name: 🍺 CD · Update

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run.
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: homebrew-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: "🧑‍💻 Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN || github.token }}

      - name: "🍺 Update"
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
        shell: sh
        run: |
          set -eu
          dry_run="${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}"
          branch='bot/maintenance-homebrew'
          changed_files="${RUNNER_TEMP}/homebrew-changed-files"
          assets_dir="${RUNNER_TEMP}/homebrew-assets"
          : > "${changed_files}"
          mkdir -p "${assets_dir}"

          if [ "${dry_run}" = 'false' ]; then
            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
              git switch --track -c "${branch}" "origin/${branch}"
            else
              git switch -c "${branch}"
            fi
            git config user.name 'Kira Bot'
            git config user.email 'kira@noreply.github.com'
          fi

          find Casks Formula -type f -name '*.rb' 2>/dev/null | sort | while IFS= read -r formula; do
            repository=$(sed -n 's/^[[:space:]]*# yuna-release:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p' "${formula}")
            if [ -z "${repository}" ]; then
              continue
            fi
            if [ "$(printf '%s\n' "${repository}" | wc -l | tr -d ' ')" -ne 1 ]; then
              echo "${formula}: exactly one yuna-release marker is required." >&2
              exit 1
            fi

            version=$(gh release list --repo "${repository}" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
            test -n "${version}"
            next="${formula}.next"
            cp "${formula}" "${next}"
            assets=$(sed -n 's/^[[:space:]]*# yuna-release-asset:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p' "${next}")
            if [ -z "${assets}" ]; then
              echo "${formula}: at least one yuna-release-asset marker is required." >&2
              exit 1
            fi

            for asset_template in ${assets}; do
              asset=$(printf '%s\n' "${asset_template}" | sed "s/{version}/${version}/g")
              gh release download "${version}" --repo "${repository}" --pattern "${asset}" --dir "${assets_dir}" --clobber
              asset_file="${assets_dir}/${asset}"
              test -f "${asset_file}"
              sha256=$(shasum -a 256 "${asset_file}" | awk '{print $1}')
              url="https://github.com/${repository}/releases/download/${version}/${asset}"
              awk -v asset_template="${asset_template}" -v sha256="${sha256}" -v url="${url}" '
                /^[[:space:]]*# yuna-release-asset:[[:space:]]*/ {
                  marker = $0
                  sub(/^[[:space:]]*# yuna-release-asset:[[:space:]]*/, "", marker)
                  active = marker == asset_template
                }
                active && /^[[:space:]]*url "/ && !url_written {
                  if (index($0, "#{version}") == 0) {
                    indent = substr($0, 1, match($0, /[^[:space:]]/) - 1)
                    suffix = $0
                    sub(/^[^"]*"[^"]*"/, "", suffix)
                    print indent "url \"" url "\"" suffix
                  } else {
                    print
                  }
                  url_written = 1
                  next
                }
                active && /^[[:space:]]*sha256 "/ && !sha256_written {
                  indent = substr($0, 1, match($0, /[^[:space:]]/) - 1)
                  print indent "sha256 \"" sha256 "\""
                  sha256_written = 1
                  next
                }
                { print }
                END {
                  if (!url_written || !sha256_written) {
                    exit 1
                  }
                }
              ' "${next}" > "${next}.asset"
              mv "${next}.asset" "${next}"
            done

            awk -v version="${version}" '
              /^[[:space:]]*version "/ && !version_written {
                indent = substr($0, 1, match($0, /[^[:space:]]/) - 1)
                print indent "version \"" version "\""
                version_written = 1
                next
              }
              { print }
              END {
                if (!version_written) {
                  exit 1
                }
              }
            ' "${next}" > "${next}.version"
            mv "${next}.version" "${next}"

            if cmp -s "${formula}" "${next}"; then
              rm "${next}"
            else
              mv "${next}" "${formula}"
              printf '%s\n' "${formula}" >> "${changed_files}"
              printf 'formula=%s\n' "${formula}"
              printf 'repository=%s\n' "${repository}"
              printf 'version=%s\n' "${version}"
            fi
          done

          git diff --check
          if [ ! -s "${changed_files}" ]; then
            echo 'Formulae are current.'
            exit 0
          fi
          while IFS= read -r formula; do
            case "${formula}" in
              Casks/*)
                brew style "${formula}"
                ;;
              Formula/*)
                brew style "${formula}"
                ;;
            esac
          done < "${changed_files}"
          git diff -- Casks Formula

          if [ "${dry_run}" = 'true' ]; then
            exit 0
          fi

          while IFS= read -r formula; do
            git add -- "${formula}"
          done < "${changed_files}"
          git commit -m 'brew: update releases'
          git push origin "${branch}"
          pr=$(gh pr list --base main --head "${branch}" --state open --json number --jq '.[0].number')
          if [ -n "${pr}" ]; then
            printf 'pr=%s\n' "${pr}"
          else
            gh pr create --base main --head "${branch}" --title 'brew: update releases' --body ''
          fi
          gh workflow run build-pr.yml --ref "${branch}" -f ref="${branch}"
